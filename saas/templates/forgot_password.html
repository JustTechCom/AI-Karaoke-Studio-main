{% extends "base.html" %}
{% block title %}Şifremi Unuttum - AI Karaoke Studio{% endblock %}

{% block content %}
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="text-center mb-4">
        <div style="font-size: 3rem;">🔑</div>
        <h2 class="fw-bold">Şifremi Unuttum</h2>
        <p class="text-muted">E-posta adresinizi girin, sıfırlama bağlantısı gönderelim.</p>
    </div>
    <div class="card p-4">
        <div id="alert-container"></div>
        <form id="forgotForm">
            <div class="mb-3">
                <label class="form-label">E-posta Adresi</label>
                <input type="email" class="form-control" id="email" placeholder="ornek@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                <i class="fas fa-paper-plane me-2"></i>Sıfırlama Bağlantısı Gönder
            </button>
        </form>
    </div>
    <div class="text-center mt-3">
        <a href="/login" style="color: var(--primary);">← Giriş Sayfasına Dön</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Gönderiliyor...';

    const email = document.getElementById('email').value;
    const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email}),
    });
    const data = await res.json();
    document.getElementById('alert-container').innerHTML = `
        <div class="alert alert-success mb-3">
            <i class="fas fa-check-circle me-2"></i>${data.message}
        </div>
    `;
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Sıfırlama Bağlantısı Gönder';
});
</script>
{% endblock %}
