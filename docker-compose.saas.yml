version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: karaoke-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karaoke-net

  postgres:
    image: postgres:15-alpine
    container_name: karaoke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: karaoke_saas
      POSTGRES_USER: ${POSTGRES_USER:-karaoke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karaoke_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karaoke}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karaoke-net

  # ─── Application ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.saas
    container_name: karaoke-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_URL=${APP_URL:-http://localhost:8000}
      - SECRET_KEY=${SECRET_KEY:-change-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-karaoke}:${POSTGRES_PASSWORD:-karaoke_secret}@postgres:5432/karaoke_saas
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - STRIPE_PRICE_ENTERPRISE=${STRIPE_PRICE_ENTERPRISE:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@aikaraoke.studio}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123!}
      - ACOUST_ID=${ACOUST_ID:-}
      - GENIUS_API_ACCESS_TOKEN=${GENIUS_API_ACCESS_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./saas_data:/app/saas_data
      - ./fonts:/app/fonts:ro
      - ./effects:/app/effects:ro
      - ./logs:/app/logs
      - ./modules:/app/modules
      - ./saas:/app/saas
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - karaoke-net
    command: uvicorn saas_app:app --host 0.0.0.0 --port 8000 --workers 2

  # ─── Celery Worker (GPU processing) ──────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.saas
    container_name: karaoke-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-karaoke}:${POSTGRES_PASSWORD:-karaoke_secret}@postgres:5432/karaoke_saas
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ACOUST_ID=${ACOUST_ID:-}
      - GENIUS_API_ACCESS_TOKEN=${GENIUS_API_ACCESS_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./saas_data:/app/saas_data
      - ./fonts:/app/fonts:ro
      - ./effects:/app/effects:ro
      - ./logs:/app/logs
      - ./gerisayim:/app/gerisayim:ro
      - ./modules:/app/modules
      - ./saas:/app/saas
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - karaoke-net
    command: celery -A celery_worker.celery_app worker --loglevel=info --queues=karaoke --concurrency=2

  # ─── Celery Monitoring (optional) ────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: karaoke-flower
    restart: unless-stopped
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flowerpass}
    depends_on:
      - redis
    networks:
      - karaoke-net

  # ─── Reverse Proxy (optional, uncomment for production) ──────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: karaoke-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #   networks:
  #     - karaoke-net

volumes:
  redis_data:
  postgres_data:

networks:
  karaoke-net:
    driver: bridge
