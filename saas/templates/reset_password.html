{% extends "base.html" %}
{% block title %}Şifre Sıfırla - AI Karaoke Studio{% endblock %}

{% block content %}
<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="text-center mb-4">
        <div style="font-size: 3rem;">🔒</div>
        <h2 class="fw-bold">Yeni Şifre Belirle</h2>
    </div>
    <div class="card p-4">
        <div id="alert-container"></div>
        <form id="resetForm">
            <input type="hidden" id="token" value="{{ reset_token }}">
            <div class="mb-3">
                <label class="form-label">Yeni Şifre</label>
                <input type="password" class="form-control" id="password" placeholder="En az 8 karakter" required minlength="8">
            </div>
            <div class="mb-3">
                <label class="form-label">Şifre Tekrar</label>
                <input type="password" class="form-control" id="password2" placeholder="Şifreyi tekrar girin" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                <i class="fas fa-lock me-2"></i>Şifremi Sıfırla
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if (p1 !== p2) {
        document.getElementById('alert-container').innerHTML = '<div class="alert alert-danger mb-3">Şifreler eşleşmiyor.</div>';
        return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: document.getElementById('token').value, new_password: p1}),
    });
    const data = await res.json();
    if (res.ok) {
        window.location.href = '/login?reset=true';
    } else {
        document.getElementById('alert-container').innerHTML = `<div class="alert alert-danger mb-3">${data.detail}</div>`;
        btn.disabled = false;
    }
});
</script>
{% endblock %}
